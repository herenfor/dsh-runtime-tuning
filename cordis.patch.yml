# dsh-runtime-tuning bundle patch。每个子插件一个独立 id，可在自己的 cordis.patch.yml 里单独关掉或改配置：
#   - id: runtime-tuning-ask-nonblocking
#     disabled: true
# DSH 自带的聊天界面（ui-chat）停用，换成下面插入的 chat-answer-fix 替身：沿用官方包名，只改回答的判定。
# 按 id 打的补丁里 name 只用来核对，不能换模块，所以是停用加插入。写在 ui-chat 上的配置由替身转交。
- id: ui-chat
  disabled: true
- insert:
    - id: runtime-tuning-wait-guard
      name: ./plugins/wait-guard.mjs
    - id: runtime-tuning-ask-nonblocking
      name: ./plugins/ask-nonblocking.mjs
      config:
        timeout: 1
    - id: runtime-tuning-secret-guard
      name: ./plugins/secret-guard.mjs
    - id: runtime-tuning-secret-files
      name: ./plugins/secret-files.mjs
    - id: runtime-tuning-session-tmp
      name: ./plugins/session-tmp.mjs
    - id: runtime-tuning-fs-view
      name: ./plugins/fs-view.mjs
    - id: runtime-tuning-net-log
      name: ./plugins/net-log.mjs
    - id: runtime-tuning-stream-stall
      name: ./plugins/stream-stall.mjs
    - id: runtime-tuning-todo-reminder
      name: ./plugins/todo-reminder.mjs
    - id: runtime-tuning-progress-note
      name: ./plugins/progress-note.mjs
    - id: runtime-tuning-ui-chat
      name: ./ui-chat/index.mjs
    # 调优预设（tuned）：自己写的一份固定预设，用来和 standard 对比把活干完的总耗时。
    # 相比 standard 去掉了定时任务、goal、计划模式、workflow 和 subagent_fork，加了 tool-use-prompt 的工具使用规则（不限制思考）；
    # 留下的子插件配置与 DSH 0.2.2-rc.2 的 standard 相同（rc.2 的 tool-subagent-control 加了 interrupt: false、新增 tool-office）。
    # 唯一的例外是 skill-filesystem.customSkillDirs：standard 用声明文件里的 baseUrl 解析 @deepseek-ai/dsh-agent-preset/skills，
    # 调优预设声明在插件包里，照抄会解析失败，所以调优模式没有 dsh-doc 技能。
    # 默认关闭：用某个预设开始的对话会一直绑在这个预设上，预设没了或加载失败，这些对话就不能再继续。
    # 想用的在自己的 cordis.patch.yml 里给 runtime-tuning-preset-tuned 这一行写 `disabled: false`。
    - id: runtime-tuning-preset-tuned
      name: '@deepseek-ai/dsh-agent-preset'
      disabled: true
      config:
        id: tuned
        name: 调优
        description: dsh-runtime-tuning 的调优模式：去掉日常编码用不到的工具，加一段用好工具的规则，思考不设限
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                config:
                  interrupt: false
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-office
            name: '@deepseek-ai/dsh-tool-office'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js '!ctx.get(''profileContext'')'
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
          # 预设里的子插件按宿主的路径解析（官方子插件都写包名），所以这里也写包名加子路径
          - id: tool-use-prompt
            name: '@herenfor/dsh-tune/plugins/tool-use-prompt.mjs'
