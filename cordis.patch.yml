# dsh-runtime-tuning bundle patch。每个子插件一个独立 id，可在自己的 cordis.patch.yml 里单独关掉或改配置：
#   - id: runtime-tuning-ask-nonblocking
#     disabled: true
# DSH 自带的聊天界面（ui-chat）停用，换成下面插入的 chat-answer-fix 替身：沿用官方包名，只改回答的判定。
# 按 id 打的补丁里 name 只用来核对，不能换模块，所以是停用加插入。写在 ui-chat 上的配置由替身转交。
- id: ui-chat
  disabled: true
- insert:
    - id: runtime-tuning-wait-guard
      name: ./plugins/wait-guard.mjs
    - id: runtime-tuning-ask-nonblocking
      name: ./plugins/ask-nonblocking.mjs
      config:
        timeout: 1
    - id: runtime-tuning-secret-guard
      name: ./plugins/secret-guard.mjs
    - id: runtime-tuning-session-tmp
      name: ./plugins/session-tmp.mjs
    - id: runtime-tuning-net-log
      name: ./plugins/net-log.mjs
    - id: runtime-tuning-ui-chat
      name: ./ui-chat/index.mjs
    # 精简预设（lean）：自己写的一份固定预设，用来和 standard 对比总耗时。
    # 相比 standard 去掉了定时任务、goal、计划模式、workflow 和 subagent_fork，加了 lean-prompt 的执行规则；
    # 留下的子插件配置与 DSH 0.2.1-rc.5 的 standard 相同。
    - id: runtime-tuning-preset-lean
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: lean
        name: 精简
        description: 去掉日常编码用不到的工具，加一段少走步数的执行规则（dsh-runtime-tuning）
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: lean-prompt
            name: ./plugins/lean-prompt.mjs
